name: Auto Assign Reviewer & Assignee

on:
  pull_request_target:
    types: [ opened, ready_for_review ]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-assign:
    name: Assign @NotTheAmmar
    runs-on: ubuntu-latest
    steps:
      - name: Assign Assignee and Reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'NotTheAmmar';
            const pr = context.payload.pull_request;
            const prAuthor = pr.user.login;

            // Always assign NotTheAmmar as Assignee
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [owner]
              });
              console.log(`Successfully assigned @${owner} as assignee on PR #${pr.number}`);
            } catch (err) {
              console.error(`Failed to assign assignee: ${err.message}`);
            }

            // If PR author is someone other than the owner, request review
            if (prAuthor !== owner) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  reviewers: [owner]
                });
                console.log(`Successfully requested review from @${owner} on PR #${pr.number}`);
              } catch (err) {
                console.error(`Failed to request review: ${err.message}`);
              }
            }
