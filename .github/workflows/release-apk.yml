name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version (e.g. 0.1.0-alpha.1 or 1.0.0). Leave blank to use pubspec.yaml version.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as Pre-release on GitHub (auto-detected if version contains alpha/beta/rc)'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Semantic Version
        id: semver
        run: |
          set -e
          # 1. Determine target version name
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          else
            # Extract version from pubspec.yaml (e.g. 1.0.0+1 -> 1.0.0)
            RAW_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+[^ ]*)\+[0-9]+/\1/' | sed -E 's/version: *//')
          fi

          # 2. Strict SemVer validation (accepts standard X.Y.Z or X.Y.Z-prerelease)
          if [[ ! "$RAW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version '$RAW_VER' does not match Semantic Versioning (e.g., 1.0.0 or 0.1.0-alpha.1)."
            exit 1
          fi

          # 3. Detect pre-release status
          IS_PRERELEASE="false"
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]] || [[ "$RAW_VER" =~ (alpha|beta|rc|dev|preview) ]]; then
            IS_PRERELEASE="true"
          fi

          # 4. Monotonically increasing build number
          BUILD_NUM="${{ github.run_number }}"
          APK_BASENAME="BazaarSetu-v${RAW_VER}-build${BUILD_NUM}"

          echo "version_name=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "apk_basename=${APK_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo " Building BazaarSetu Release APK"
          echo " Semantic Version : $RAW_VER"
          echo " Pre-release      : $IS_PRERELEASE"
          echo " Build Number     : $BUILD_NUM"
          echo " Artifact Name    : ${APK_BASENAME}.apk"
          echo "=============================================="

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment file (.env)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -n "$APP_ENV" ]; then
            echo "✓ Found repository secret APP_ENV. Injecting into .env for release build..."
            printf '%s\n' "$APP_ENV" > .env
          else
            echo "⚠️ Secret APP_ENV not configured; falling back to .env.example..."
            cp .env.example .env
          fi
          test -s .env && echo "✓ .env file ready ($(wc -l < .env) lines)"

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Release APK (Strict Versioned)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="${{ steps.semver.outputs.version_name }}" \
            --build-number="${{ steps.semver.outputs.build_number }}"

      - name: Package & Generate Checksum
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "${{ steps.semver.outputs.apk_basename }}.apk"
          sha256sum "${{ steps.semver.outputs.apk_basename }}.apk" > "${{ steps.semver.outputs.apk_basename }}.sha256"
          cat "${{ steps.semver.outputs.apk_basename }}.sha256"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.semver.outputs.apk_basename }}
          path: |
            build/app/outputs/flutter-apk/${{ steps.semver.outputs.apk_basename }}.apk
            build/app/outputs/flutter-apk/${{ steps.semver.outputs.apk_basename }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version_name }}
          name: BazaarSetu v${{ steps.semver.outputs.version_name }} (Build ${{ steps.semver.outputs.build_number }})
          files: |
            build/app/outputs/flutter-apk/${{ steps.semver.outputs.apk_basename }}.apk
            build/app/outputs/flutter-apk/${{ steps.semver.outputs.apk_basename }}.sha256
          draft: false
          prerelease: ${{ steps.semver.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
