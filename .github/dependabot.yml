version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Maintain Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Maintain Flutter / pub dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # google_fonts >= 9.0.0 brings conflicting material_ui TextTheme definition
      - dependency-name: "google_fonts"
        versions: [">= 9.0.0"]
      # permission_handler >= 13.0.0 hardcodes unreleased compileSdk 37 (incompatible with AGP 9.1.0)
      - dependency-name: "permission_handler"
        versions: [">= 13.0.0"]
      # build_runner >= 2.17.0 requires build 5.0.0 which breaks mockito 5.4.5
      - dependency-name: "build_runner"
        versions: [">= 2.17.0"]
