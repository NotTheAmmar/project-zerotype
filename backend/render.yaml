services:
  - type: web
    name: project-zerotype-bpp
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    envVars:
      - key: BPP_SUBSCRIBER_ID
        value: bazaarsetu.bpp.org
      - key: BPP_PUBLIC_URI
        sync: false # Set to https://<your-render-app-name>.onrender.com/beckn
      - key: DATABASE_URL
        sync: false # Set to Supabase IPv4 Pooler: postgresql+asyncpg://postgres.[REF]:[PASS]@aws-0-[REGION].pooler.supabase.com:6543/postgres
      - key: SUPABASE_URL
        sync: false # e.g. https://[REF].supabase.co
      - key: SUPABASE_KEY
        sync: false # Service role secret
      - key: SUPABASE_STORAGE_BUCKET
        value: craft-images
