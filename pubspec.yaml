name: project_zerotype
description: "Project ZeroType (BazaarSetu) — Voice-First Autonomous Guided Catalog Engine for Rural Artisans"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Camera & image
  camera: ^0.12.2
  image_picker: ^1.2.4
  image: ^4.12.0

  # Audio
  record: ^7.1.2
  audioplayers: ^6.4.0
  flutter_tts: ^4.2.2

  # Environment
  flutter_dotenv: ^6.0.1

  # Typography
  google_fonts: ^9.0.0

  # UI helpers
  shimmer: ^4.0.0
  cupertino_icons: ^2.0.0

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  http: ^1.3.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  build_runner: ^2.16.2

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.jpeg"
  min_sdk_android: 21 # android min sdk min:16, default 21
